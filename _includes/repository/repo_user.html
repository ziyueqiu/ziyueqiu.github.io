{%- comment -%}
Static GitHub profile card; see repo.html.
{%- endcomment -%}
<a class="repo-card" href="https://github.com/{{ include.username }}">
  <span class="repo-card-title">
    <i class="fab fa-github" aria-hidden="true"></i>
    <span class="repo-card-name">{{ include.username }}</span>
  </span>
  <span class="repo-card-desc">GitHub profile</span>
</a>
